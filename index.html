<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GST 212 – Philosophy Study Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght=700;900&family=DM+Sans:ital,wght=0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0f0e17;
  --paper: #f7f4ef;
  --gold: #c9a84c;
  --gold-light: #e8d5a3;
  --gold-dim: #c9a84c33;
  --navy: #1a1a2e;
  --navy-mid: #16213e;
  --red: #e05c3a;
  --green: #3a8c5c;
  --card: #ffffff;
  --muted: #6b6660;
  --border: #ddd8d0;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--paper);
  color: var(--ink);
  line-height: 1.6;
  min-height: 100vh;
}

/* ── HEADER ── */
header {
  background: var(--navy);
  padding: 28px 40px 24px;
  position: relative;
  overflow: hidden;
}
header::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 70% 50%, #c9a84c18 0%, transparent 70%);
}
.header-inner {
  max-width: 1100px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  position: relative;
}
.header-title h1 {
  font-family: 'Playfair Display', serif;
  font-size: 1.8rem;
  color: #fff;
  line-height: 1.2;
}
.header-title p { color: var(--gold-light); font-size: 0.85rem; margin-top: 4px; font-weight: 300; }
.header-stats {
  display: flex;
  gap: 16px;
}
.stat-chip {
  background: #ffffff14;
  border: 1px solid #ffffff22;
  border-radius: 8px;
  padding: 8px 14px;
  text-align: center;
  color: #fff;
}
.stat-chip .num { font-size: 1.3rem; font-weight: 700; color: var(--gold); display: block; }
.stat-chip .lbl { font-size: 0.7rem; opacity: .7; letter-spacing: .05em; text-transform: uppercase; }

/* ── NAV TABS ── */
.tab-bar {
  background: var(--navy-mid);
  padding: 0 40px;
  display: flex;
  gap: 0;
  overflow-x: auto;
  scrollbar-width: none;
}
.tab-bar::-webkit-scrollbar { display: none; }
.tab-btn {
  padding: 14px 20px;
  color: #aaa;
  font-size: 0.83rem;
  cursor: pointer;
  border: none;
  background: none;
  border-bottom: 3px solid transparent;
  white-space: nowrap;
  transition: all .2s;
  font-family: 'DM Sans', sans-serif;
  letter-spacing: .03em;
}
.tab-btn:hover { color: var(--gold-light); }
.tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }

/* ── LAYOUT ── */
.app-body { max-width: 1100px; margin: 0 auto; padding: 28px 24px; }

/* ── MODE BUTTONS ── */
.mode-bar {
  display: flex;
  gap: 10px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}
.mode-btn {
  padding: 9px 18px;
  border-radius: 24px;
  border: 2px solid var(--border);
  background: #fff;
  cursor: pointer;
  font-size: 0.85rem;
  font-family: 'DM Sans', sans-serif;
  color: var(--muted);
  transition: all .2s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.mode-btn:hover { border-color: var(--gold); color: var(--ink); }
.mode-btn.active { background: var(--navy); color: var(--gold); border-color: var(--navy); }

/* ── PANELS ── */
.panel { display: none; }
.panel.active { display: block; }

/* ── NOTES PANEL ── */
.notes-grid {
  display: grid;
  grid-template-columns: 260px 1fr;
  gap: 24px;
  min-height: 540px;
}
.topic-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.topic-item {
  padding: 11px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.84rem;
  border: 1px solid transparent;
  transition: all .18s;
  display: flex;
  align-items: center;
  gap: 10px;
  background: #fff;
}
.topic-item:hover { border-color: var(--gold); }
.topic-item.active { background: var(--navy); color: #fff; border-color: var(--navy); }
.topic-item .t-num {
  background: var(--gold-dim);
  color: var(--gold);
  border-radius: 4px;
  font-size: 0.72rem;
  font-weight: 700;
  padding: 2px 6px;
  flex-shrink: 0;
}
.topic-item.active .t-num { background: #ffffff22; color: var(--gold-light); }

.notes-content {
  background: #fff;
  border-radius: 12px;
  border: 1px solid var(--border);
  padding: 28px 32px;
  overflow-y: auto;
  max-height: 74vh;
}
.notes-content h2 {
  font-family: 'Playfair Display', serif;
  font-size: 1.5rem;
  margin-bottom: 20px;
  color: var(--navy);
  padding-bottom: 12px;
  border-bottom: 2px solid var(--gold-dim);
}
.notes-content h3 {
  font-size: 0.95rem;
  font-weight: 700;
  margin: 18px 0 8px;
  color: var(--navy);
  display: flex;
  align-items: center;
  gap: 8px;
}
.notes-content h3::before {
  content: '';
  display: inline-block;
  width: 4px;
  height: 16px;
  background: var(--gold);
  border-radius: 2px;
}
.notes-content p { margin-bottom: 10px; font-size: 0.93rem; color: #333; }
.notes-content ul { margin: 6px 0 12px 0; list-style: none; }
.notes-content ul li {
  padding: 5px 0 5px 20px;
  font-size: 0.9rem;
  color: #333;
  position: relative;
  border-bottom: 1px dashed #eee;
}
.notes-content ul li:last-child { border-bottom: none; }
.notes-content ul li::before {
  content: '→';
  color: var(--gold);
  position: absolute;
  left: 0;
  font-size: 0.8rem;
}
.key-box {
  background: #fffbf0;
  border: 1px solid var(--gold);
  border-left: 4px solid var(--gold);
  border-radius: 6px;
  padding: 12px 16px;
  margin: 10px 0;
  font-size: 0.88rem;
}
.key-box strong { color: #7a5c00; }

/* AI Explain button */
.ai-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--navy);
  color: var(--gold);
  border: none;
  border-radius: 8px;
  padding: 8px 14px;
  font-size: 0.8rem;
  cursor: pointer;
  margin-top: 16px;
  font-family: 'DM Sans', sans-serif;
  transition: opacity .2s;
}
.ai-btn:hover { opacity: .85; }
.ai-response {
  background: #f0f4ff;
  border-left: 3px solid #4a6cf7;
  border-radius: 8px;
  padding: 14px 16px;
  margin-top: 12px;
  font-size: 0.88rem;
  line-height: 1.7;
  display: none;
}
.ai-response.visible { display: block; }
.ai-loading { color: var(--muted); font-style: italic; }

/* ── QUIZ PANEL ── */
.quiz-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 12px;
}
.quiz-controls { display: flex; gap: 10px; flex-wrap: wrap; }
.quiz-select {
  padding: 8px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.85rem;
  background: #fff;
  cursor: pointer;
}
.quiz-start-btn {
  padding: 9px 22px;
  background: var(--navy);
  color: var(--gold);
  border: none;
  border-radius: 8px;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.88rem;
  cursor: pointer;
  transition: opacity .2s;
}
.quiz-start-btn:hover { opacity: .85; }

.progress-bar-wrap {
  background: #eee;
  border-radius: 10px;
  height: 6px;
  margin-bottom: 20px;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--gold), var(--red));
  border-radius: 10px;
  transition: width .4s ease;
}

.q-card {
  background: #fff;
  border-radius: 14px;
  padding: 28px 32px;
  border: 1px solid var(--border);
  box-shadow: 0 2px 16px #0000060a;
}
.q-meta {
  font-size: 0.78rem;
  color: var(--muted);
  margin-bottom: 12px;
  text-transform: uppercase;
  letter-spacing: .06em;
}
.q-text {
  font-size: 1.05rem;
  font-weight: 500;
  margin-bottom: 22px;
  line-height: 1.5;
  color: var(--ink);
}
.options-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 20px;
}
.opt-btn {
  padding: 13px 16px;
  border: 2px solid var(--border);
  border-radius: 10px;
  background: #fafafa;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.9rem;
  text-align: left;
  transition: all .18s;
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--ink);
}
.opt-btn:hover:not(:disabled) { border-color: var(--navy); background: #f0f2ff; }
.opt-btn .opt-key {
  min-width: 26px;
  height: 26px;
  border-radius: 6px;
  background: var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.78rem;
  font-weight: 700;
}
.opt-btn.correct { border-color: var(--green); background: #f0fdf4; color: var(--green); }
.opt-btn.correct .opt-key { background: var(--green); color: #fff; }
.opt-btn.wrong { border-color: var(--red); background: #fff5f3; color: var(--red); }
.opt-btn.wrong .opt-key { background: var(--red); color: #fff; }
.opt-btn:disabled { cursor: default; }

.q-feedback {
  font-size: 0.88rem;
  padding: 10px 14px;
  border-radius: 8px;
  margin-bottom: 16px;
  display: none;
}
.q-feedback.show { display: block; }
.q-feedback.ok { background: #f0fdf4; color: var(--green); border: 1px solid #bbf7d0; }
.q-feedback.bad { background: #fff5f3; color: var(--red); border: 1px solid #fecaca; }

.q-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.q-nav-btn {
  padding: 10px 22px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.88rem;
  transition: all .2s;
}
.q-nav-btn.prev { background: #eee; color: var(--ink); }
.q-nav-btn.next { background: var(--navy); color: var(--gold); }
.q-nav-btn:hover:not(:disabled) { opacity: .85; }
.q-nav-btn:disabled { opacity: .35; cursor: default; }

.quiz-score-card {
  background: var(--navy);
  color: #fff;
  border-radius: 16px;
  padding: 40px;
  text-align: center;
  display: none;
}
.quiz-score-card.show { block; }
.score-big {
  font-family: 'Playfair Display', serif;
  font-size: 4rem;
  color: var(--gold);
  line-height: 1;
}
.score-label { color: #aaa; margin-top: 6px; margin-bottom: 24px; }
.score-grid {
  display: flex;
  justify-content: center;
  gap: 32px;
  margin-bottom: 28px;
}
.score-item .s-num { font-size: 1.6rem; font-weight: 700; }
.score-item .s-lbl { font-size: 0.75rem; color: #aaa; text-transform: uppercase; letter-spacing: .06em; }
.score-correct { color: #6ee7b7; }
.score-wrong { color: #fca5a5; }
.score-skipped { color: #fde68a; }
.retry-btn {
  padding: 12px 28px;
  background: var(--gold);
  color: var(--navy);
  border: none;
  border-radius: 8px;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  transition: opacity .2s;
}
.retry-btn:hover { opacity: .9; }

/* ── FLASHCARDS ── */
.flashcard-wrap {
  perspective: 1000px;
  margin: 0 auto 24px;
  max-width: 620px;
  height: 280px;
  cursor: pointer;
}
.flashcard {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform .5s ease;
}
.flashcard.flipped { transform: rotateY(180deg); }
.fc-face {
  position: absolute;
  inset: 0;
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 32px;
  backface-visibility: hidden;
}
.fc-front {
  background: var(--navy);
  color: #fff;
  border: 2px solid #ffffff18;
}
.fc-back {
  background: #fff;
  border: 2px solid var(--gold);
  transform: rotateY(180deg);
}
.fc-tag {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: .1em;
  opacity: .55;
  margin-bottom: 12px;
}
.fc-question {
  font-size: 1.1rem;
  font-weight: 500;
  line-height: 1.5;
  color: #fff;
}
.fc-answer {
  font-size: 1rem;
  color: var(--navy);
  font-weight: 600;
}
.fc-hint {
  font-size: 0.78rem;
  color: var(--gold);
  margin-top: 14px;
}
.fc-hint-back {
  font-size: 0.78rem;
  color: var(--muted);
  margin-top: 10px;
}
.fc-controls {
  display: flex;
  gap: 12px;
  justify-content: center;
  align-items: center;
  max-width: 620px;
  margin: 0 auto;
}
.fc-btn {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  border: none;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.88rem;
  cursor: pointer;
  transition: all .2s;
  font-weight: 500;
}
.fc-btn.got-it { background: var(--green); color: #fff; }
.fc-btn.review { background: #fff3; color: var(--ink); border: 1px solid var(--border); }
.fc-btn.skip { background: #eee; color: var(--muted); }
.fc-progress { text-align: center; font-size: 0.8rem; color: var(--muted); margin: 12px 0; }

/* ── ASK AI ── */
.ask-ai-wrap {
  max-width: 760px;
  margin: 0 auto;
}
.ask-ai-intro {
  background: var(--navy);
  color: #fff;
  border-radius: 12px;
  padding: 24px 28px;
  margin-bottom: 20px;
  display: flex;
  gap: 16px;
  align-items: flex-start;
}
.ask-ai-intro .icon { font-size: 2rem; flex-shrink: 0; }
.ask-ai-intro h3 { font-family: 'Playfair Display', serif; margin-bottom: 6px; color: var(--gold); }
.ask-ai-intro p { font-size: 0.88rem; color: #ccc; }

.quick-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 16px;
}
.quick-chip {
  padding: 7px 14px;
  border: 1px solid var(--border);
  border-radius: 20px;
  font-size: 0.82rem;
  cursor: pointer;
  background: #fff;
  transition: all .18s;
  color: var(--ink);
}
.quick-chip:hover { background: var(--navy); color: var(--gold); border-color: var(--navy); }

.chat-box {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
}
.chat-msgs {
  padding: 20px;
  min-height: 200px;
  max-height: 380px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.msg {
  display: flex;
  gap: 10px;
  align-items: flex-start;
}
.msg.user { flex-direction: row-reverse; }
.msg-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.85rem;
}
.msg.user .msg-avatar { background: var(--navy); color: var(--gold); }
.msg.ai .msg-avatar { background: var(--gold-dim); color: var(--gold); }
.msg-bubble {
  max-width: 80%;
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 0.88rem;
  line-height: 1.6;
}
.msg.user .msg-bubble { background: var(--navy); color: #fff; border-bottom-right-radius: 4px; }
.msg.ai .msg-bubble { background: #f7f4ef; color: var(--ink); border-bottom-left-radius: 4px; }
.chat-input-row {
  display: flex;
  gap: 0;
  border-top: 1px solid var(--border);
}
.chat-input {
  flex: 1;
  padding: 14px 18px;
  border: none;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.9rem;
  background: #fafafa;
  outline: none;
  resize: none;
}
.chat-send {
  padding: 14px 20px;
  background: var(--navy);
  color: var(--gold);
  border: none;
  cursor: pointer;
  font-size: 1rem;
  transition: opacity .2s;
}
